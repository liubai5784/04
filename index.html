<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>留白的作品空间</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="site-bg"></div>
  <header class="topbar">
    <a class="brand" href="#home">留白 / 作品空间</a>
    <nav class="nav" aria-label="主导航">
      <div class="nav-item">
        <a class="nav-trigger" href="#games">小游戏</a>
        <div class="nav-menu" id="gamesMenu"></div>
      </div>
      <div class="nav-item">
        <a class="nav-trigger" href="#gallery">照片</a>
        <div class="nav-menu">
          <a href="#gallery">作品墙</a>
          <a href="admin/index.html#upload">上传照片</a>
        </div>
      </div>
      <div class="nav-item">
        <a class="nav-trigger" href="#tools">工具</a>
        <div class="nav-menu" id="toolsMenu"></div>
      </div>
      <div class="nav-item">
        <a class="nav-trigger" href="admin/index.html#links">后台</a>
        <div class="nav-menu">
          <a href="admin/index.html#links">入口管理</a>
          <a href="admin/index.html#upload">上传照片</a>
        </div>
      </div>
    </nav>
  </header>

  <main id="home">
    <section class="hero section-panel">
      <div class="hero-copy">
        <p class="eyebrow">Games / Images / Tools</p>
        <h1>留白的作品空间</h1>
        <p class="hero-desc">这里收藏我做过的小项目：练习用的小游戏、顺手写的网页工具，还有一张张慢慢攒起来的生成图片。它像一个安静的作品架，先把灵感放好，再一点点长成更完整的空间。</p>
        <div class="hero-actions">
          <a class="btn primary" href="#games">查看小游戏</a>
          <a class="btn ghost" href="#gallery">进入相册</a>
        </div>
      </div>
      <div class="hero-visual large" style="background-image: url('assets/images/hero.png'); background-size: cover; background-position: center;" role="img" aria-label="作品空间主视觉"></div>
    </section>

    <section id="games" class="section-panel">
      <div class="section-title">
        <p class="eyebrow">Game Collection</p>
        <h2>小游戏合集</h2>
      </div>
      <div class="card-grid" id="gamesGrid"></div>
    </section>

    <section id="gallery" class="section-panel">
      <div class="section-title">
        <p class="eyebrow">Image Gallery</p>
        <h2>生成照片 / 作品墙</h2>
      </div>
      <div class="gallery-grid" id="galleryGrid"></div>
    </section>

    <section id="tools" class="section-panel">
      <div class="section-title">
        <p class="eyebrow">Tool Box</p>
        <h2>学习工具箱</h2>
      </div>
      <div class="tool-list" id="toolList"></div>
    </section>
  </main>

  <footer class="footer">© 2026 留白 / Personal Gallery Website</footer>

  <script src="script.js"></script>
</body>
</html>
