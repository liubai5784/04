<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>照片拼图小游戏 / 留白的作品空间</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <div class="site-bg"></div>
  <header class="topbar">
    <a class="brand" href="../index.html#home">留白 / 作品空间</a>
    <nav class="nav" aria-label="拼图导航">
      <a class="nav-trigger" href="../index.html#games">返回小游戏</a>
      <a class="nav-trigger" href="../index.html#gallery">照片墙</a>
    </nav>
  </header>

  <main>
    <section class="section-panel puzzle-hero">
      <div class="section-title">
        <p class="eyebrow">Puzzle Game</p>
        <h1>照片拼图</h1>
        <p>默认调用照片墙里的图片，也可以临时选择本地图片。自定义横向和纵向切块数量，点击或拖动碎片完成拼图。</p>
      </div>
      <div class="puzzle-controls">
        <label>横向切块
          <input id="puzzleCols" type="number" min="2" max="8" value="3" />
        </label>
        <label>纵向切块
          <input id="puzzleRows" type="number" min="2" max="8" value="3" />
        </label>
        <button class="btn ghost" id="applyPuzzleGrid" type="button">应用切块</button>
      </div>
      <div class="hero-actions">
        <button class="btn primary" id="useGalleryPhoto" type="button">换一张照片墙图片</button>
        <label class="btn ghost">
          选择本地图片
          <input id="puzzleImageInput" type="file" accept="image/*" hidden />
        </label>
        <button class="btn ghost" id="shufflePuzzle" type="button">重新打乱</button>
        <button class="btn ghost" id="resetPuzzle" type="button">恢复默认图</button>
      </div>
      <p class="upload-tip" id="puzzleTip">正在读取照片墙图片……</p>
    </section>

    <section class="section-panel puzzle-layout">
      <div>
        <div class="puzzle-board" id="puzzleBoard" aria-label="照片拼图区域"></div>
      </div>
      <aside class="puzzle-side">
        <h2>玩法</h2>
        <p>先设置横向、纵向切块数量，再点击“应用切块”。目标是把所有碎片拖回正确顺序。</p>
        <div class="puzzle-preview" id="puzzlePreview"></div>
        <div class="stats-grid puzzle-stats">
          <article><strong id="moveCount">0</strong><span>移动次数</span></article>
          <article><strong id="puzzleStatus">未完成</strong><span>当前状态</span></article>
        </div>
      </aside>
    </section>
  </main>

  <footer class="footer">© 2026 留白 / Puzzle Game</footer>

  <script src="puzzle.js?v=20260615-gallery"></script>
</body>
</html>
