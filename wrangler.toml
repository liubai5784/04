name = "photo-room-04"
compatibility_date = "2026-06-09"
pages_build_output_dir = "."

[[r2_buckets]]
binding = "PHOTO_BUCKET"
bucket_name = "photo-room-04"

# Cloudflare Pages 需要在后台绑定 D1。
# 绑定变量名必须是 PHOTO_DB。
# database_id 创建后在 Cloudflare 后台复制填入。
[[d1_databases]]
binding = "PHOTO_DB"
database_name = "photo-room-04-db"
database_id = "replace-with-your-d1-database-id"
